version: '2' # 修正：数値ではなく "文字列" で書く必要があります

run:
    go: '1.24'
    timeout: 5m
    modules-download-mode: readonly

linters:
    enable:
        - gocritic
        - revive
        - misspell
        - errcheck
        - staticcheck

settings:
    gocritic:
        enabled-tags:
            - diagnostic
            - experimental
            - opinionated
            - performance
            - style
    revive:
        rules:
            - name: exported
              disabled: true
            - name: package-comments
              disabled: true

issues:
    exclude:
        - path: _test\.go
          linters:
              - gocritic
        - path: examples/
          linters:
              - revive
        - text: 'commentedOutCode'
          path: examples/
