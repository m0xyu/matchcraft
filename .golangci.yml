version: 2
run:
    go: '1.24'
    timeout: 5m
    modules-download-mode: readonly

linters:
    disable-all: true
    enable:
        - gocritic
        - revive
        - misspell
        - errcheck
        - staticcheck

linters-settings:
    gocritic:
        enabled-tags:
            - diagnostic
            - experimental
            - opinionated
            - performance
            - style
    revive:
        rules:
            - name: exported

issues:
    exclude-rules:
        - path: _test\.go
          linters:
              - gocritic
        - path: examples/
          linters:
              - revive
        - path: examples/
          text: 'commentedOutCode'
