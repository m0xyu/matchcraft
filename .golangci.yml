# v2系では文字列での指定が推奨されます
version: '2'

run:
    go: '1.24'
    timeout: 5m
    modules-download-mode: readonly

linters:
    enable:
        - gocritic
        - misspell
        - revive
        - errcheck
        - staticcheck

    settings:
        gocritic:
            enabled-tags:
                - diagnostic
                - experimental
                - opinionated
                - performance
                - style
        revive:
            rules:
                - name: exported
                  disabled: true
                - name: package-comments
                  disabled: true
        errcheck:
            check-type-assertions: true

issues:
    exclusions:
        presets:
            - comments
        paths:
            - examples$
            - _test\.go$

# 必要に応じて出力形式を指定
output:
    sort-results: true
